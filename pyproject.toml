[project]
name = "ki-review"
version = "0.1.0"
description = "Review AI-generated code changes against best practices"
readme = "README.md"
authors = [
    { name = "Fabian Distler", email = "fabian.distler@gmx.net" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
