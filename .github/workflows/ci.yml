name: CI

on:
  pull_request:
    paths-ignore: ["plans/**"]
  push:
    branches: [main]
    paths-ignore: ["plans/**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
